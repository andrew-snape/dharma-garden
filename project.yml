name: Weeds
options:
  bundleIdPrefix: com.snape
  deploymentTarget:
    macOS: "14.0"
packages:
  WeedsCore:
    path: WeedsCore
schemes:
  Weeds:
    build:
      targets:
        Weeds: all
    run:
      config: Debug
    test:
      config: Debug
targets:
  Weeds:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: WeedsCore
      - package: WeedsCore
        product: WeedsArt
    entitlements:
      path: App/Weeds.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.personal-information.location: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Garden
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.games
        NSLocationUsageDescription: Used to match your garden to the weather where you live.
        NSLocationWhenInUseUsageDescription: Used to match your garden to the weather where you live.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.snape.weeds
        PRODUCT_NAME: Garden
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
