name: DharmaGarden
options:
  bundleIdPrefix: com.snape
  deploymentTarget:
    macOS: "14.0"
packages:
  DharmaGardenCore:
    path: DharmaGardenCore
schemes:
  DharmaGarden:
    build:
      targets:
        DharmaGarden: all
    run:
      config: Debug
    test:
      config: Debug
targets:
  DharmaGarden:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: DharmaGardenCore
      - package: DharmaGardenCore
        product: DharmaGardenArt
    entitlements:
      path: App/DharmaGarden.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.personal-information.location: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Dharma Garden
        CFBundleShortVersionString: "1.1.0"
        CFBundleVersion: "2"
        LSApplicationCategoryType: public.app-category.games
        NSLocationUsageDescription: Used to match your garden to the weather where you live.
        NSLocationWhenInUseUsageDescription: Used to match your garden to the weather where you live.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.snape.dharmagarden
        PRODUCT_NAME: "Dharma Garden"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "2"
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
